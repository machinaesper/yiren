name: Sync stock from Notion

on:
  schedule:
    - cron: "*/30 * * * *"   # ทุก 30 นาที (GitHub อาจดีเลย์ 5-15 นาทีตอนคนใช้เยอะ)
  workflow_dispatch:          # กดรันเองได้ทันทีเมื่ออยากให้เว็บอัปเดตเดี๋ยวนั้น

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read Notion, mirror icons, write items.json
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/sync-notion.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A items.json icons data/icon-manifest.json
          git diff --staged --quiet || git commit -m "Update stock from Notion"
          git push
