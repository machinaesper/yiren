name: Build GW2 icon index

on:
  schedule:
    - cron: "17 4 * * 1"   # ทุกวันจันทร์ ตี 4:17 UTC
  workflow_dispatch:        # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

concurrency:
  group: gw2-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch item names and icons
        run: node scripts/build-index.mjs

      - name: Commit index if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gw2-index.json
          git diff --staged --quiet || git commit -m "Refresh GW2 icon index"
          git push
